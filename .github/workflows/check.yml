name: Check deployment configuration
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_api.cjs
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m compileall -q app scripts tests
      - run: docker build -t research-mvp .

  cloud-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sites/research-patient-cards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites/research-patient-cards/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node tests/worker.test.mjs
